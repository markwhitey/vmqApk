name: Build low-power heartbeat test APK

on:
  push:
    branches: ["codex/low-power-heartbeat-itgoyo"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heartbeat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test isolated APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package test information
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/vmq-heartbeat-test.apk
          cp docs/HEARTBEAT-TEST.md artifact/INSTALL-AND-TEST.md
          printf '%s\n' "$GITHUB_SHA" > artifact/SOURCE-COMMIT.txt
          sha256sum artifact/vmq-heartbeat-test.apk > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vmq-heartbeat-test-${{ github.run_number }}
          path: artifact/
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
